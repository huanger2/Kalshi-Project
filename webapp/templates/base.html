<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI vs Kalshi{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css?v={{ static_version() }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">AI vs Kalshi</a>
        <span class="tagline">NBA, NFL, NHL &amp; MLB prediction markets, compared</span>
    </header>
    <nav class="tabs">
        {% set tracked = tracked_leagues() %}
        <a href="/" class="{% if active_tab == 'markets' %}active{% endif %}">All markets</a>
        {% for lg in league_codes %}
            <a href="/league/{{ lg }}"
               class="{% if active_tab == lg %}active{% endif %}{% if lg not in tracked %} untracked{% endif %}"
               {% if lg not in tracked %}title="Not tracking {{ lg }}"{% endif %}>{{ lg }}</a>
        {% endfor %}
        <span class="tab-divider" aria-hidden="true"></span>
        {% for name in ai_names %}
            <a href="/ai/{{ name }}" class="{% if active_tab == name %}active{% endif %}">{{ name }}</a>
        {% endfor %}
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
